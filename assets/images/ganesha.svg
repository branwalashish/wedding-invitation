<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0CD" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#E5C158" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8B1D2C" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Halo / Aura -->
  <circle cx="100" cy="100" r="92" stroke="url(#goldGlow)" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.6"/>
  <circle cx="100" cy="100" r="86" stroke="url(#goldGlow)" stroke-width="0.8" opacity="0.4"/>
  
  <!-- Crown / Mukut -->
  <path d="M85 38 L100 20 L115 38 L110 52 L90 52 Z" fill="url(#goldGlow)" filter="url(#shadow)"/>
  <circle cx="100" cy="30" r="3" fill="#8B1D2C"/>
  <path d="M80 52 Q100 46 120 52" stroke="url(#goldGlow)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Tilak (Trishul style) -->
  <path d="M96 58 Q100 52 104 58 L102 70 Q100 73 98 70 Z" fill="#C5162D"/>
  <circle cx="100" cy="74" r="2.5" fill="#C5162D"/>
  <path d="M93 62 Q100 66 107 62" stroke="url(#goldGlow)" stroke-width="1.5" fill="none"/>
  
  <!-- Ears -->
  <!-- Left Ear -->
  <path d="M78 65 C55 60 48 85 58 105 C66 118 78 115 82 108" fill="none" stroke="url(#goldGlow)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Right Ear -->
  <path d="M122 65 C145 60 152 85 142 105 C134 118 122 115 118 108" fill="none" stroke="url(#goldGlow)" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Ear Ornaments -->
  <circle cx="63" cy="85" r="4" fill="url(#goldGlow)"/>
  <circle cx="137" cy="85" r="4" fill="url(#goldGlow)"/>
  
  <!-- Trunk and Face -->
  <path d="M86 78 C90 70 110 70 114 78 C116 85 115 95 112 108 C108 125 106 142 120 148 C128 152 135 148 138 142 C140 138 138 132 133 133 C128 134 126 140 130 142" 
        fill="none" stroke="url(#goldGlow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Tusk (Ekdanta) -->
  <path d="M88 98 L80 102 L88 105 Z" fill="url(#goldGlow)"/>
  
  <!-- Modak / Laddu in hand -->
  <circle cx="145" cy="120" r="7" fill="url(#goldGlow)"/>
  <circle cx="145" cy="120" r="3" fill="#C5162D"/>
  
  <!-- Bell / Choker -->
  <path d="M88 115 Q100 120 112 115" stroke="url(#goldGlow)" stroke-width="2" fill="none"/>
  <circle cx="100" cy="122" r="3.5" fill="url(#goldGlow)"/>
  
  <!-- Eyes -->
  <ellipse cx="88" cy="74" rx="2" ry="3.5" fill="#4A151D" transform="rotate(-15 88 74)"/>
  <ellipse cx="112" cy="74" rx="2" ry="3.5" fill="#4A151D" transform="rotate(15 112 74)"/>
</svg>
